project:
  type: website
  output-dir: _site
  resources:
    - "images/hero-*"
    - "images/oxford-anthropology-logo.png"

website:
  title: "Comparative Evolutionary Anthropology (CEA)"
  site-url: https://cea-lab.org
  description: "Comparative Evolutionary Anthropology — University of Oxford"
  favicon: images/favicon.png
  
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Research"
        href: research.qmd
      - text: "People"
        href: people.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Resources"
        href: resources.qmd
      - text: "Opportunities"
        href: opportunities.qmd
    right:
      - icon: github
        href: https://github.com/ThomasPueschel
        aria-label: GitHub
      - icon: twitter
        href: https://twitter.com/ThomasPuschel
        aria-label: Twitter

  page-footer:
    left: '<a href="https://www.anthro.ox.ac.uk" target="_blank"><img src="/images/oxford-anthropology-logo.png" alt="Oxford Anthropology" style="height:44px;width:auto;vertical-align:middle;margin-right:0.75rem;"></a> © 2026 Comparative Evolutionary Anthropology (CEA) · University of Oxford'
    right:
      - icon: envelope
        href: mailto:thomas.puschel@anthro.ox.ac.uk

format:
  html:
    theme: 
      light: [flatly, styles.css]
    toc: false
    anchor-sections: false
    link-external-icon: false
    link-external-newwindow: true

execute:
  freeze: auto

