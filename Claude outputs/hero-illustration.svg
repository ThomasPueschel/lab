<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ab4e0"/>
      <stop offset="70%" stop-color="#a8d8f0"/>
      <stop offset="100%" stop-color="#c8ebf8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a030"/>
      <stop offset="100%" stop-color="#b07820"/>
    </linearGradient>
    <linearGradient id="water-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a90c8"/>
      <stop offset="100%" stop-color="#2a6090"/>
    </linearGradient>
    <linearGradient id="eleph-g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b0b8c0"/>
      <stop offset="100%" stop-color="#8090a0"/>
    </linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ab8d0"/>
      <stop offset="100%" stop-color="#a8cce0"/>
    </linearGradient>
    <clipPath id="border">
      <rect width="960" height="640" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#border)">
  <!-- Sky -->
  <rect width="960" height="640" fill="url(#sky)"/>
