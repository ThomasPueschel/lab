    <path d="M-30,104 Q-74,130 -78,175 Q-80,210 -57,216 Q-38,222 -32,198" stroke="#8a7050" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- arms -->
    <path d="M-26,52 Q-50,76 -52,112" stroke="#9a8060" stroke-width="17" stroke-linecap="round" fill="none"/>
    <ellipse cx="-52" cy="114" rx="14" ry="9" fill="#c09060" transform="rotate(-15,-52,114)"/>
    <path d="M26,54 Q48,78 46,116" stroke="#9a8060" stroke-width="17" stroke-linecap="round" fill="none"/>
    <ellipse cx="46" cy="118" rx="14" ry="9" fill="#c09060" transform="rotate(15,46,118)"/>
    <!-- legs -->
    <path d="M-14,108 Q-18,144 -16,174" stroke="#9a8060" stroke-width="20" stroke-linecap="round" fill="none"/>
    <path d="M14,110 Q18,144 16,176" stroke="#9a8060" stroke-width="20" stroke-linecap="round" fill="none"/>
    <ellipse cx="-16" cy="177" rx="18" ry="10" fill="#8a7050"/>
    <ellipse cx="16" cy="179" rx="18" ry="10" fill="#8a7050"/>
  </g>

  <!-- Birds -->
  <g transform="translate(110,96) rotate(-8)">
    <path d="M0,0 Q-20,11 -54,9 Q-32,17 -10,11 L0,20 L10,11 Q32,17 54,9 Q20,11 0,0Z" fill="#8b4010"/>
    <ellipse cx="0" cy="0" rx="11" ry="8" fill="#7a3808"/>
    <path d="M9,5 L5,19 Q0,24 -5,19 L-9,5" fill="#6a3008"/>
  </g>
  <g transform="translate(830,83) rotate(5)">
    <path d="M0,0 Q-17,10 -47,8 Q-28,15 -9,10 L0,18 L9,10 Q28,15 47,8 Q17,10 0,0Z" fill="#8b4010"/>
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="#7a3808"/>
    <path d="M8,5 L4,17 Q0,22 -4,17 L-8,5" fill="#6a3008"/>
  </g>

  <!-- Butterfly -->
  <g transform="translate(272,120)">
    <path d="M0,0 Q-32,-42 -56,-16 Q-42,14 0,9Z" fill="#7ab8e8" opacity="0.9"/>
    <path d="M0,0 Q32,-42 56,-16 Q42,14 0,9Z" fill="#7ab8e8" opacity="0.9"/>
    <path d="M0,9 Q-26,30 -38,20 Q-26,38 0,28Z" fill="#5898c8" opacity="0.85"/>
    <path d="M0,9 Q26,30 38,20 Q26,38 0,28Z" fill="#5898c8" opacity="0.85"/>
    <circle cx="-30" cy="-4" r="7" fill="#3878a8" opacity="0.4"/>
    <circle cx="30" cy="-4" r="7" fill="#3878a8" opacity="0.4"/>
    <ellipse cx="0" cy="14" rx="4" ry="16" fill="#2a3848"/>
    <circle cx="0" cy="-1" r="4.5" fill="#2a3848"/>
    <path d="M-2,-6 Q-12,-22 -16,-32" stroke="#2a3848" stroke-width="1.4" fill="none"/>
    <path d="M2,-6 Q12,-22 16,-32" stroke="#2a3848" stroke-width="1.4" fill="none"/>
    <circle cx="-16" cy="-32" r="3" fill="#2a3848"/>
