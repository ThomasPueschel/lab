          stroke="#9aa4ae" stroke-width="44" stroke-linecap="round" fill="none"/>
    <ellipse cx="-10" cy="314" rx="21" ry="13" fill="#8a9a9e" transform="rotate(-10,-10,314)"/>
    <!-- tusk -->
    <path d="M22,178 Q-20,224 -42,252" stroke="#f0ead0" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M-42,252 Q-52,264 -48,276" stroke="#e8e0c0" stroke-width="11" stroke-linecap="round" fill="none"/>
    <!-- legs -->
    <rect x="52" y="352" width="54" height="114" rx="25" fill="#9aa4ae"/>
    <rect x="118" y="358" width="54" height="108" rx="25" fill="#9aa4ae"/>
    <rect x="222" y="354" width="54" height="112" rx="25" fill="#9aa4ae"/>
    <rect x="284" y="348" width="54" height="118" rx="25" fill="#9aa4ae"/>
    <ellipse cx="79" cy="468" rx="34" ry="13" fill="#8a9098"/>
    <ellipse cx="145" cy="468" rx="34" ry="13" fill="#8a9098"/>
    <ellipse cx="249" cy="468" rx="34" ry="13" fill="#8a9098"/>
    <ellipse cx="311" cy="466" rx="34" ry="13" fill="#8a9098"/>
    <!-- tail -->
    <path d="M338,248 Q372,274 368,314 Q364,338 352,342" stroke="#9aa4ae" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M352,342 Q346,358 342,368" stroke="#7a8890" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ===== MACAQUE right ===== -->
  <g transform="translate(812,308)">
    <ellipse cx="0" cy="64" rx="38" ry="48" fill="#9a8060"/>
    <ellipse cx="0" cy="70" rx="24" ry="32" fill="#c8a880" opacity="0.45"/>
    <ellipse cx="4" cy="15" rx="34" ry="32" fill="#9a8060"/>
    <ellipse cx="6" cy="17" rx="23" ry="22" fill="#d09060"/>
    <path d="M-12,4 Q6,-3 24,4" stroke="#7a6040" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="-2" cy="11" r="6.5" fill="#1a1008"/>
    <circle cx="15" cy="11" r="6.5" fill="#1a1008"/>
    <circle cx="-1" cy="10" r="2.2" fill="white"/>
    <circle cx="16" cy="10" r="2.2" fill="white"/>
    <ellipse cx="1" cy="23" rx="4" ry="3" fill="#b07040"/>
    <ellipse cx="11" cy="23" rx="4" ry="3" fill="#b07040"/>
    <path d="M-4,32 Q5,37 15,32" stroke="#905030" stroke-width="1.8" fill="none"/>
    <ellipse cx="-28" cy="15" rx="12" ry="14" fill="#9a8060"/>
    <ellipse cx="-28" cy="15" rx="8" ry="10" fill="#d09060"/>
