    <ellipse cx="210" cy="70" rx="55" ry="30"/>
    <ellipse cx="100" cy="90" rx="45" ry="25"/>
    <ellipse cx="680" cy="65" rx="60" ry="28"/>
    <ellipse cx="740" cy="58" rx="48" ry="25"/>
    <ellipse cx="630" cy="75" rx="40" ry="22"/>
  </g>
  <!-- Mountains -->
  <polygon points="500,330 590,180 680,330" fill="url(#mtn)" opacity="0.55"/>
  <polygon points="600,330 690,205 790,330" fill="#98c0d8" opacity="0.45"/>
  <!-- Trees left -->
  <rect x="30" y="248" width="18" height="140" fill="#7a5020"/>
  <ellipse cx="39" cy="240" rx="68" ry="24" fill="#2a8030"/>
  <ellipse cx="39" cy="228" rx="52" ry="18" fill="#38a040"/>
  <rect x="148" y="215" width="15" height="175" fill="#7a5020"/>
  <ellipse cx="156" cy="195" rx="52" ry="52" fill="#2a8030"/>
  <ellipse cx="156" cy="178" rx="40" ry="40" fill="#38a040"/>
  <ellipse cx="156" cy="164" rx="28" ry="28" fill="#4ab050"/>
  <!-- Trees right -->
  <rect x="840" y="224" width="17" height="160" fill="#7a5020"/>
  <ellipse cx="848" cy="216" rx="58" ry="22" fill="#2a8030"/>
  <ellipse cx="848" cy="202" rx="44" ry="16" fill="#38a040"/>
  <rect x="898" y="244" width="15" height="145" fill="#7a5020"/>
  <ellipse cx="906" cy="236" rx="50" ry="20" fill="#2a8030"/>
  <!-- Ground -->
  <rect x="0" y="398" width="960" height="242" fill="url(#ground)"/>
  <!-- Water bottom right -->
  <ellipse cx="838" cy="518" rx="175" ry="68" fill="url(#water-g)" opacity="0.88"/>
  <ellipse cx="878" cy="542" rx="130" ry="44" fill="#3a7ab8" opacity="0.5"/>
  <path d="M715,512 Q755,500 795,512 Q835,524 875,512" stroke="white" stroke-width="2" fill="none" opacity="0.45"/>
  <path d="M735,528 Q775,516 815,528 Q855,540 895,528" stroke="white" stroke-width="2" fill="none" opacity="0.35"/>
  <ellipse cx="705" cy="474" rx="20" ry="11" fill="#8a8880"/>
  <ellipse cx="730" cy="482" rx="15" ry="9" fill="#7a7870"/>
  <ellipse cx="876" cy="484" rx="18" ry="10" fill="#8a8880"/>
