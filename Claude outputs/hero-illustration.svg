    <ellipse cx="52" cy="54" rx="44" ry="42" fill="#2a1e0e"/>
    <ellipse cx="60" cy="58" rx="30" ry="28" fill="#c09060"/>
    <path d="M30,40 Q58,30 82,40" stroke="#1a1008" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="48" cy="48" r="7" fill="#1a1008"/>
    <circle cx="70" cy="48" r="7" fill="#1a1008"/>
    <circle cx="50" cy="46" r="2.5" fill="white"/>
    <circle cx="72" cy="46" r="2.5" fill="white"/>
    <ellipse cx="54" cy="65" rx="5" ry="4" fill="#a07040"/>
    <ellipse cx="66" cy="65" rx="5" ry="4" fill="#a07040"/>
    <path d="M46,76 Q60,83 74,76" stroke="#8a5030" stroke-width="2" fill="none"/>
    <ellipse cx="12" cy="50" rx="14" ry="16" fill="#2a1e0e"/>
    <ellipse cx="12" cy="50" rx="9" ry="11" fill="#c09060"/>
    <!-- front arms knuckle walking -->
    <path d="M-24,82 Q-58,108 -72,148" stroke="#2a1e0e" stroke-width="24" stroke-linecap="round" fill="none"/>
    <ellipse cx="-72" cy="150" rx="17" ry="11" fill="#c09060" transform="rotate(-20,-72,150)"/>
    <path d="M20,92 Q6,124 2,158" stroke="#2a1e0e" stroke-width="22" stroke-linecap="round" fill="none"/>
    <ellipse cx="2" cy="160" rx="17" ry="11" fill="#c09060" transform="rotate(10,2,160)"/>
    <!-- hind legs -->
    <path d="M-18,136 Q-22,168 -20,200" stroke="#2a1e0e" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M18,138 Q20,168 18,202" stroke="#2a1e0e" stroke-width="24" stroke-linecap="round" fill="none"/>
    <ellipse cx="-21" cy="203" rx="22" ry="11" fill="#2a1e0e"/>
    <ellipse cx="18" cy="203" rx="22" ry="11" fill="#2a1e0e"/>
  </g>

  <!-- Small rodent foreground -->
  <g transform="translate(252,438)">
    <ellipse cx="0" cy="0" rx="25" ry="12" fill="#9a8065" transform="rotate(-8)"/>
    <ellipse cx="23" cy="-5" rx="14" ry="11" fill="#9a8065"/>
    <circle cx="31" cy="-8" r="2.5" fill="#1a1008"/>
    <ellipse cx="35" cy="-4" rx="5" ry="3" fill="#8a6a50"/>
    <path d="M-25,3 Q-44,-2 -54,7" stroke="#9a8065" stroke-width="3" stroke-linecap="round" fill="none"/>
    <line x1="-8" y1="9" x2="-6" y2="22" stroke="#9a8065" stroke-width="2.5"/>
    <line x1="5" y1="10" x2="6" y2="23" stroke="#9a8065" stroke-width="2.5"/>
  </g>

