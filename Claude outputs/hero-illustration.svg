  <g fill="#1e6828">
    <path d="M0,535 Q38,484 18,640 Q6,538 44,506 Q22,574 0,640Z"/>
    <path d="M14,550 Q58,496 36,640 Q18,552 62,518 Q36,584 14,640Z"/>
  </g>
