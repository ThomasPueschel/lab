    <!-- ear -->
    <ellipse cx="40" cy="46" rx="10" ry="13" fill="#e8b878"/>
    <!-- eye -->
    <ellipse cx="59" cy="36" rx="6" ry="7" fill="white"/>
    <circle cx="59" cy="38" r="4.5" fill="#3a2010"/>
    <circle cx="60.5" cy="36" r="1.8" fill="white"/>
    <path d="M51,28 Q59,23 68,28" stroke="#7a3010" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- nose -->
    <path d="M67,44 Q70,52 66,56" stroke="#d4a070" stroke-width="2" fill="none"/>
    <!-- mouth -->
    <path d="M57,62 Q65,67 73,62" stroke="#c08060" stroke-width="2" fill="none"/>
    <!-- neck -->
    <rect x="63" y="78" width="20" height="22" rx="7" fill="#f0c080"/>
    <!-- shirt purple -->
    <path d="M46,98 Q28,106 24,182 L64,184 L84,184 L120,178 Q114,102 98,98 Q86,90 60,98Z" fill="#9035c0"/>
    <!-- sleeve left arm (back, hanging) -->
    <path d="M46,106 Q20,138 16,178" stroke="#9035c0" stroke-width="28" stroke-linecap="round" fill="none"/>
    <ellipse cx="15" cy="180" rx="14" ry="10" fill="#f5c890"/>
    <!-- sleeve right arm (forward) -->
    <path d="M98,106 Q118,142 116,186" stroke="#9035c0" stroke-width="26" stroke-linecap="round" fill="none"/>
    <ellipse cx="116" cy="188" rx="14" ry="10" fill="#f5c890"/>
    <!-- belt -->
    <rect x="46" y="178" width="76" height="13" rx="5" fill="#1a2a5a"/>
    <!-- back leg (jeans, dark) -->
    <path d="M46,188 Q40,240 44,306" stroke="#1e3278" stroke-width="36" stroke-linecap="round" fill="none"/>
    <ellipse cx="44" cy="308" rx="24" ry="13" fill="#8a2010" transform="rotate(-18,44,308)"/>
    <!-- front leg (jeans, striding forward) -->
    <path d="M82,188 Q94,244 88,308" stroke="#253a90" stroke-width="36" stroke-linecap="round" fill="none"/>
    <ellipse cx="89" cy="310" rx="24" ry="13" fill="#8a2010" transform="rotate(12,89,310)"/>
  </g>

  <!-- ===== ELEPHANT (large, centre-right) ===== -->
  <g transform="translate(484,112)">
    <!-- body -->
    <ellipse cx="172" cy="234" rx="182" ry="142" fill="url(#eleph-g)"/>
    <ellipse cx="298" cy="204" rx="62" ry="82" fill="#c8d0d8" opacity="0.3"/>
